name: tag

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    timeout-minutes: 9
    runs-on: ubuntu-22.04
    env:
      PUBLISH_TOKEN: ${{secrets.PACKAGES_PUBLISH_TOKEN}}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 18.x
          registry-url: 'https://registry.npmjs.org'
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

      - run: npm i

      - name: npm release
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
        run: |
          npm publish

      - name: github release
        run: |
          npm config set '//npm.pkg.github.com/:_authToken' "${PUBLISH_TOKEN}"
          npm publish --scope=@translated --registry=https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
